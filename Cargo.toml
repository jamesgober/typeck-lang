# =============================================================================
#  R E P S   ·   typeck-lang
# =============================================================================
[package]
name    = "typeck-lang"
version = "0.3.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Profile-driven type checking over HIR: dynamic, gradual, static (generics, traits, inference), and Hindley-Milner from one checker."

# Keywords (5 max)
keywords = ["typechecker", "inference", "types", "compiler", "lexersketch"]

# Categories
categories = ["compilers", "development-tools", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/typeck-lang"
repository    = "https://github.com/jamesgober/typeck-lang"
documentation = "https://docs.rs/typeck-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "typeck_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# The standard library. Without it the crate is `no_std` and needs only `alloc`.
std = ["hir-lang/std", "intern-lang/std", "match-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# The input: the checker walks HIR (spec v3) and keys its side tables by HIR ids.
hir-lang = { version = "0.4", default-features = false }
# Names: `Lookup` renders symbols in type displays and diagnostic messages. The
# same interner version hir-lang uses, so `Symbol`s pass between them unchanged.
intern-lang = { version = "1", default-features = false }
# Exhaustiveness and usefulness: the checker implements match-lang's `Model`
# over its own types and reports missing witnesses and unreachable arms.
match-lang = { version = "0.2", default-features = false }
# type-lang is deliberately not wired: its unifier expands shared structure
# exponentially (ISSUES M39-M41). See dev/ROADMAP.md, "Dependency wiring".


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
